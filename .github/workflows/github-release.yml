name: GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and attach debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Name release APK
        shell: bash
        run: |
          asset_name="WaySpot-${GITHUB_REF_NAME//\//-}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$asset_name"
          echo "ASSET_NAME=$asset_name" >> "$GITHUB_ENV"

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber
