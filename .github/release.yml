changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Funcionalidades
      labels:
        - feature
        - enhancement
    - title: Correcciones
      labels:
        - bug
        - fix
    - title: Documentación
      labels:
        - documentation
    - title: Otros cambios
      labels:
        - '*'
